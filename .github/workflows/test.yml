name: Tests

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR/branch runs add no signal. Reusable release verification keeps
# its own run ID so a later push cannot cancel a release's checks.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  dependency-upgrade:
    name: Dependency local boot and previous release upgrade
    if: github.event_name != 'workflow_call'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build and boot the disposable local installation
        run: npm run local
      - name: Verify the previous public release database upgrade
        run: npm run local:upgrade-check -- 0.0.86
      - name: Remove only the disposable local installation
        if: always()
        run: npm run local:destroy

  coolify-running-apps:
    name: Three running Sails apps migration proof
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - name: Prepare pinned test-only PostgreSQL adapter
        run: npm install --prefix "$RUNNER_TEMP/migration-deps" --ignore-scripts --no-audit --no-fund sails-postgresql@5.0.1
      - name: Prepare disposable Linux fixture images
        run: |
          docker pull node:22-bookworm
          docker pull node:24-bookworm
          docker pull postgres:17-alpine
          docker pull redis:7-alpine
          docker pull alpine
          docker pull lucaslorentz/caddy-docker-proxy@sha256:f3ebe7e762bccf17ce38b88420f80ce63f69dc548eea0cd6e5f29db2ae2ea062
      - name: Rehearse real app and state migration
        run: node_modules/.bin/sounding test --file tests/contracts/coolify-running-apps.test.js --test-concurrency=1 --test-timeout=600000
        env:
          SLIPWAY_MIGRATION_DEPS: ${{ runner.temp }}/migration-deps/node_modules
      - name: Preserve scope, exact head and per-app evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: three-running-app-migration-proof
          path: |
            .tmp/migration-proof
            .tmp/sounding/artifacts
          if-no-files-found: error
          retention-days: 90

  shipwright-assets:
    name: Shipwright assets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Verify Sails dev assets and Vue HMR
        run: node_modules/.bin/sounding test --file tests/contracts/shipwright-hmr.test.js
      - name: Verify production manifest and browser assets
        run: NODE_ENV=production node tests/contracts/shipwright-production.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shipwright-assets
          path: .tmp/sounding/artifacts/shipwright
          if-no-files-found: ignore
          retention-days: 7

  helm-command-contract:
    name: Helm command runtime contract
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - name: Verify installed Quest registry initialization without ORM
        run: node --test tests/contracts/quest-registry-initialization.cjs
      - name: Verify focused command process and installed Sails CLI contracts
        run: node_modules/.bin/sounding test --file tests/unit/helpers/helm/command-runtime.test.js --file tests/unit/helpers/helm/command-sails.test.js --file tests/unit/helpers/helm/app-context.test.js --test-concurrency=1
      - run: docker pull node:22-bookworm-slim
        if: success() || failure()
      - name: Verify disposable command runtime and process cleanup
        if: success() || failure()
        run: node_modules/.bin/sounding test --file tests/contracts/helm-commands.test.js --test-concurrency=1

  helm-terminal-prompt-review:
    name: Helm terminal prompt paired evidence
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Capture matching baseline and current terminal fixtures
        run: bash scripts/compare-helm-terminal-prompt.sh
      - name: Verify current component files were restored
        if: always()
        run: git diff --exit-code -- assets/js/components/HelmCommandConsole.vue assets/js/components/HelmWriteGuardDialog.vue
      - name: Upload paired screenshots and raw timing samples
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: helm-terminal-prompt-paired-evidence
          path: .tmp/screenshots/helm-terminal-prompt
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload capture failure evidence
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: helm-terminal-prompt-capture-failures
          path: .tmp/sounding/artifacts
          if-no-files-found: ignore
          retention-days: 7

  custom-services-contract:
    name: Custom services contract
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: docker pull node:22-alpine
      - run: docker pull lucaslorentz/caddy-docker-proxy@sha256:f3ebe7e762bccf17ce38b88420f80ce63f69dc548eea0cd6e5f29db2ae2ea062
      - run: node_modules/.bin/sounding test --file tests/contracts/custom-services.test.js --file tests/contracts/custom-service-routes.test.js --file tests/contracts/custom-service-updates.test.js --test-concurrency=1

  external-postgresql-contract:
    name: External PostgreSQL contract
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: docker pull postgres:17-alpine
      - run: node_modules/.bin/sounding test --file tests/contracts/external-postgresql.test.js

  storage-contract:
    name: Storage and Bearing upload contracts
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - name: Install pinned local emulators
        run: npm install --prefix "$RUNNER_TEMP/storage-emulators" --ignore-scripts --no-audit --no-fund azurite@3.37.0 s3rver@3.7.1
      - run: npx playwright install --with-deps chromium
      - run: docker pull postgres:15-alpine
      - name: Exercise storage, backup, restoration, and Bearing image uploads
        run: node_modules/.bin/sounding test --file tests/contracts/object-storage.test.js --file tests/contracts/bearing-feedback-storage.test.js --file tests/contracts/restore-tests.test.js --test-concurrency=1
        env:
          SLIPWAY_STORAGE_EMULATORS: ${{ runner.temp }}/storage-emulators/node_modules

  schema-contract:
    name: Schema contract (${{ matrix.dialect }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: postgresql
            image: postgres:16-alpine
          - dialect: mysql
            image: mysql:8.4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: docker pull '${{ matrix.image }}'
      - run: node scripts/verify-schema-diff-containers.js
        env:
          SLIPWAY_SCHEMA_TEST_DIALECT: ${{ matrix.dialect }}

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run Prettier check
        run: npm run lint

      - name: Check docs and runtime consistency
        run: npm run check:consistency

      - name: Keep dashboard runtime independent of package source
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          function check(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const filename = path.join(directory, entry.name)
              if (entry.isDirectory()) check(filename)
              else if (entry.name.endsWith('.js') && fs.readFileSync(filename, 'utf8').includes('packages/hook')) {
                throw new Error(`Dashboard runtime imports excluded hook source: ${filename}`)
              }
            }
          }
          check('api')
          NODE

      - name: Verify dashboard contracts reach the Docker build context
        run: |
          docker build -f - . <<'DOCKERFILE'
          FROM node:22-alpine
          WORKDIR /app
          COPY api/lib/helm-completions.js api/lib/quest-run-ledger.js api/lib/quest-runtime-client.js api/lib/quest-workspace.js api/lib/
          COPY api/lib/contracts/ api/lib/contracts/
          RUN node -e "require('./api/lib/helm-completions'); require('./api/lib/contracts/helm-config-fingerprint'); require('./api/lib/contracts/wake-contract'); require('./api/lib/contracts/wake-value-contract'); require('./api/lib/quest-run-ledger'); require('./api/lib/quest-runtime-client'); require('./api/lib/quest-workspace')"
          DOCKERFILE

  upgrade-release-baselines:
    name: Native upgrade baseline (${{ matrix.version }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['0.0.86', '0.0.87']
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Capture stopped published-release physical schemas
        run: bash tests/prelift/capture-release-baseline.sh '${{ matrix.version }}' baseline.json
      - name: Verify published image and physical baseline remain immutable
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const actual = require('./baseline.json')
          const expected = require('./api/lib/upgrades/baselines/${{ matrix.version }}.json')
          assert.equal(actual.image, expected.image)
          for (const [datastore, database] of Object.entries(expected.databases)) {
            assert.equal(actual.databases[datastore].present, database.present)
            assert.equal(actual.databases[datastore].schemaHash, database.schemaHash)
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-baseline-${{ matrix.version }}
          path: baseline.json
          if-no-files-found: error

  upgrade-legacy-adoption-baseline:
    name: Native legacy 86 to 87 adoption baseline
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Capture the actual legacy production schema handoff
        run: bash tests/prelift/capture-release-baseline.sh 0.0.87 baseline.json 0.0.86
      - name: Verify the legacy native adoption profile remains immutable
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const actual = require('./baseline.json')
          const expected = require('./api/lib/upgrades/baselines/legacy-86-to-87.json')
          assert.equal(actual.image, expected.image)
          for (const [datastore, database] of Object.entries(expected.databases)) {
            assert.equal(actual.databases[datastore].schemaHash, database.schemaHash)
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-baseline-legacy-86-to-87
          path: baseline.json
          if-no-files-found: error

  upgrade-fresh-baseline:
    name: Native current fresh install baseline
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build the exact current image
        run: docker build -t slipway-upgrade-baseline .
      - name: Capture a stopped fresh current installation
        run: bash tests/prelift/capture-release-baseline.sh 0.0.87 baseline.json current slipway-upgrade-baseline
      - name: Verify fresh schema matches the reviewed release catalog
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict')
          const actual = require('./baseline.json')
          const expected = require('./api/lib/upgrades/baselines/current-fresh.json')
          for (const [datastore, database] of Object.entries(expected.databases)) {
            assert.equal(actual.databases[datastore].schemaHash, database.schemaHash)
          }
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: upgrade-baseline-current-fresh
          path: baseline.json
          if-no-files-found: error

  migration-prelift:
    name: Migration engine before ORM lift
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - run: node --test tests/prelift/migration-executor.test.cjs tests/prelift/sqlite-schema.test.cjs tests/prelift/upgrade-ledger.test.cjs tests/prelift/upgrade-backups.test.cjs tests/prelift/upgrade-preflight.test.cjs tests/prelift/release-baselines.test.cjs tests/prelift/upgrade-coordinator.test.cjs tests/prelift/upgrade-entry-guard.test.cjs tests/prelift/upgrade-registry.test.cjs tests/prelift/schema-retirement.test.cjs tests/prelift/upgrade-process.test.cjs tests/prelift/upgrade-storage-stage.test.cjs tests/prelift/upgrade-host-controller.test.cjs tests/prelift/upgrade-handoff.test.cjs tests/prelift/upgrade-launch-config.test.cjs tests/prelift/upgrade-startup.test.cjs tests/prelift/upgrade-docker-api.test.cjs tests/prelift/upgrade-writer-snapshot.test.cjs tests/prelift/upgrade-fresh-storage.test.cjs tests/prelift/upgrade-lineage.test.cjs tests/prelift/upgrade-broker.test.cjs tests/prelift/upgrade-cli.test.cjs tests/prelift/upgrade-response.test.cjs

  upgrade-writer-fence:
    name: Native Linux upgrade writer observation
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - run: docker pull node:22-bookworm-slim
      - name: Verify disposable host, WAL and container writer fencing
        run: sudo env PATH="$PATH" SLIPWAY_WRITER_FIXTURE=1 node --test tests/prelift/upgrade-writers-linux.test.cjs
      - name: Verify real Docker host handoff and failed-health recovery
        run: sudo env PATH="$PATH" SLIPWAY_HOST_FIXTURE=1 node --test tests/prelift/upgrade-host-linux.test.cjs

  upgrade-full-image:
    name: Coordinated image startup and recovery
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - name: Verify real image, founder session, encryption and recovery
        run: bash tests/prelift/prepare-full-image.sh

  test:
    name: Test (${{ matrix.lane }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, functional]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run ${{ matrix.lane }} tests
        run: npm run test:${{ matrix.lane }} -- --profile

  browser:
    name: Browser shard (${{ matrix.shard }}/3)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      # Sounding partitions files; each runner retains --test-concurrency=1.
      - name: Verify command-mode journeys before the owning full shard
        if: matrix.shard == 1
        run: node_modules/.bin/sounding test --file tests/e2e/pages/projects/helm.test.js --test-name-pattern='^project Helm (command|Stop|preparing)' --test-concurrency=1 --test-timeout=600000
      - name: Run browser tests
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/3 --profile
      - name: Upload Helm command review screenshots
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: helm-command-review-${{ matrix.shard }}
          path: .tmp/screenshots/issue-592-commands
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Bearing widget review screenshots
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bearing-widget-review-${{ matrix.shard }}
          path: .tmp/screenshots/issue-398-bearing/widget-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Bearing save regression evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bearing-save-review-${{ matrix.shard }}
          path: .tmp/screenshots/issue-642-save-errors
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Sounding browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sounding-browser-artifacts-${{ matrix.shard }}
          path: .tmp/sounding/artifacts
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload Quest design review
        # Keep passing design evidence separate from failure diagnostics.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quest-design-review-${{ matrix.shard }}
          path: .tmp/sounding/artifacts/quest-design-review
          if-no-files-found: ignore
          retention-days: 7

  bearing_saves:
    name: Bearing save regression repeats
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Repeat the owning draft and failure-recovery trials
        run: |
          for attempt in 1 2 3; do
            echo "Bearing isolated verification $attempt/3"
            node_modules/.bin/sounding test \
              --file tests/e2e/pages/projects/bearing-drafts.test.js \
              --file tests/e2e/pages/projects/bearing-update-recovery.test.js \
              --test-name-pattern='Bearing drafts reopen|Bearing failed saves' \
              --test-concurrency=1 --test-timeout=600000
            cp -R .tmp/screenshots/issue-642-save-errors ".tmp/screenshots/issue-642-repeat-$attempt"
          done
      - name: Upload repeated Bearing save evidence
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bearing-save-repeated-review
          path: .tmp/screenshots/issue-642-*
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload isolated trial failure artifacts
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: bearing-save-isolated-failures
          path: .tmp/sounding/artifacts
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    # Preserve the existing required check name and fail if any shard fails,
    # is cancelled, or is skipped. A green shard alone is not a passing suite.
    name: Test (e2e)
    needs: [browser, bearing_saves]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require browser shards and Bearing repetitions to pass
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
          BEARING_SAVE_RESULT: ${{ needs.bearing_saves.result }}
        run: test "$BROWSER_RESULT" = success && test "$BEARING_SAVE_RESULT" = success
