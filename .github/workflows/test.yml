name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Prettier check
        run: npm run lint

      - name: Check docs and runtime consistency
        run: npm run check:consistency

  test:
    name: Test (${{ matrix.lane }})
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, functional, e2e]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        if: matrix.lane == 'e2e'
        run: |
          if find tests/e2e/pages -type f -name '*.test.js' | grep -q .; then
            npx playwright install --with-deps chromium
          else
            echo "No browser e2e tests found"
          fi

      - name: Run ${{ matrix.lane }} tests
        run: npm run test:${{ matrix.lane }}

      - name: Upload Sounding browser failure artifacts
        if: failure() && matrix.lane == 'e2e'
        uses: actions/upload-artifact@v6
        with:
          name: sounding-browser-artifacts
          path: .tmp/sounding/artifacts
          if-no-files-found: ignore
          retention-days: 7
