name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Prettier check
        run: npm run lint

      - name: Check docs and runtime consistency
        run: npm run check:consistency

  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm run test:unit

      - name: Run functional tests
        run: npm run test:functional

      - name: Install Playwright browsers
        run: |
          if find tests/e2e/pages -type f -name '*.test.js' | grep -q .; then
            npx playwright install --with-deps chromium
          else
            echo "No browser e2e tests found"
          fi

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Sounding browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: sounding-browser-artifacts
          path: .tmp/sounding/artifacts
          if-no-files-found: ignore
          retention-days: 7
