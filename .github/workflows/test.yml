name: Tests

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shipwright-assets:
    name: Shipwright assets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Verify Sails dev assets and Vue HMR
        run: node_modules/.bin/sounding test --file tests/contracts/shipwright-hmr.test.js
      - name: Verify production manifest and browser assets
        run: NODE_ENV=production node tests/contracts/shipwright-production.cjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shipwright-assets
          path: .tmp/sounding/artifacts/shipwright
          if-no-files-found: ignore
          retention-days: 7

  custom-services-contract:
    name: Custom services contract
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: docker pull node:22-alpine
      - run: docker pull lucaslorentz/caddy-docker-proxy@sha256:f3ebe7e762bccf17ce38b88420f80ce63f69dc548eea0cd6e5f29db2ae2ea062
      - run: node_modules/.bin/sounding test --file tests/contracts/custom-services.test.js --file tests/contracts/custom-service-routes.test.js --test-concurrency=1

  external-postgresql-contract:
    name: External PostgreSQL contract
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: docker pull postgres:17-alpine
      - run: node_modules/.bin/sounding test --file tests/contracts/external-postgresql.test.js

  storage-contract:
    name: Private storage contract
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - name: Install pinned local emulators
        run: npm install --prefix "$RUNNER_TEMP/storage-emulators" --ignore-scripts --no-audit --no-fund azurite@3.37.0 s3rver@3.7.1
      - name: Exercise private storage and backup lifecycle
        run: node_modules/.bin/sounding test --file tests/contracts/object-storage.test.js
        env:
          SLIPWAY_STORAGE_EMULATORS: ${{ runner.temp }}/storage-emulators/node_modules

  schema-contract:
    name: Schema contract (${{ matrix.dialect }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dialect: postgresql
            image: postgres:16-alpine
          - dialect: mysql
            image: mysql:8.4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: docker pull '${{ matrix.image }}'
      - run: node scripts/verify-schema-diff-containers.js
        env:
          SLIPWAY_SCHEMA_TEST_DIALECT: ${{ matrix.dialect }}

  lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run Prettier check
        run: npm run lint

      - name: Check docs and runtime consistency
        run: npm run check:consistency

  test:
    name: Test (${{ matrix.lane }})
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, functional, e2e]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Install Playwright browsers
        if: matrix.lane == 'e2e'
        run: |
          if find tests/e2e/pages -type f -name '*.test.js' | grep -q .; then
            npx playwright install --with-deps chromium
          else
            echo "No browser e2e tests found"
          fi

      - name: Run ${{ matrix.lane }} tests
        run: npm run test:${{ matrix.lane }}

      - name: Upload Sounding browser failure artifacts
        if: failure() && matrix.lane == 'e2e'
        uses: actions/upload-artifact@v6
        with:
          name: sounding-browser-artifacts
          path: .tmp/sounding/artifacts
          if-no-files-found: ignore
          retention-days: 7
