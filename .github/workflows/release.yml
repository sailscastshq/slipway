name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to publish'
        required: true
        type: string
      rebuild_current_version:
        description: 'Build the current version from main instead of the existing tag (image-only hotfix)'
        type: boolean
        default: false
      skip_verification:
        description: 'Publish after local verification (maintainer hotfix only)'
        type: boolean
        default: false
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    if: ${{ !inputs.skip_verification }}
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  build-and-push:
    needs: verify
    if: ${{ !cancelled() && (needs.verify.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.skip_verification)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.rebuild_current_version && 'main' || inputs.tag || github.event.release.tag_name }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(node -p "require('./package.json').version")" = "${RELEASE_TAG#v}"

      - name: Bind image metadata to the checked-out release source
        id: release-source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ steps.release-source.outputs.revision }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke-test packaged Helm and Wake modules
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          docker run --rm --entrypoint node "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG#v}" -e \
            "require('./api/lib/helm-completions'); require('./api/lib/helm-runtime'); require('./api/lib/wake-report'); require('./api/lib/wake-store')"

      - name: Push verified Docker image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image_tag; do
            if [ -n "$image_tag" ]; then docker push "$image_tag"; fi
          done <<< "$IMAGE_TAGS"
