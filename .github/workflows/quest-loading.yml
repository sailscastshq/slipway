name: Quest initial observation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quest-loading:
    name: Quest loading cache and observation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - run: node --test tests/local-review/quest-loading.test.cjs
